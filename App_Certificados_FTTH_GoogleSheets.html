<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Control de Certificados FTTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F1;
    --surface:#FFFFFF;
    --ink:#16233A;
    --ink-soft:#5B6472;
    --ink-faint:#8B93A0;
    --accent:#FF7A45;
    --accent-2:#1FA9A0;
    --border:#E1E4DE;
    --border-strong:#C9CDC5;
    --danger:#D64550;
    --radius:14px;
    --font-display:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;

    --c-ingresado-bg:#D9E6FB; --c-ingresado-ink:#1D4E89;
    --c-encontrol-bg:#FFE9B8; --c-encontrol-ink:#8A5A00;
    --c-observado-bg:#FBD6CC; --c-observado-ink:#9C3B23;
    --c-controlado-bg:#D3EAD6; --c-controlado-ink:#1E6B3A;
    --c-enviado-bg:#DDD9FB;  --c-enviado-ink:#4A3B96;
    --c-pagado-bg:#C9EEDC;   --c-pagado-ink:#12805A;
    --c-sin-bg:#ECEDE9;      --c-sin-ink:#6B7280;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body); -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }

  #app{max-width:480px; margin:0 auto; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative;}

  /* ---------- Login ---------- */
  .login-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 28px;}
  .login-mark{width:52px; height:52px; border-radius:14px; background:var(--ink); display:flex; align-items:center; justify-content:center; margin-bottom:20px;}
  .login-title{font-family:var(--font-display); font-size:24px; font-weight:700; margin-bottom:4px;}
  .login-sub{font-size:13.5px; color:var(--ink-soft); margin-bottom:28px; line-height:1.5;}
  .login-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px;}
  .login-error{color:var(--danger); font-size:13px; font-weight:600; margin-top:10px; text-align:center;}
  .login-footer{margin-top:22px; font-size:11.5px; color:var(--ink-faint); text-align:center; line-height:1.5;}

  /* ---------- Top bar ---------- */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); padding:18px 20px 12px; border-bottom:1px solid var(--border);}
  .topbar-row{display:flex; align-items:center; gap:10px;}
  .mark{width:30px; height:30px; flex:none; border-radius:8px; background:var(--ink); display:flex; align-items:center; justify-content:center;}
  .mark svg{display:block;}
  .brand{display:flex; flex-direction:column; line-height:1.15; flex:1;}
  .brand-title{font-family:var(--font-display); font-weight:600; font-size:15px; letter-spacing:0.02em;}
  .brand-sub{font-size:11px; color:var(--ink-faint); letter-spacing:0.04em; text-transform:uppercase;}
  .topbar-actions{display:flex; gap:6px;}
  .icon-btn{width:32px; height:32px; border-radius:8px; border:1px solid var(--border-strong); background:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);}
  .icon-btn.spinning svg{animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .screen-title{font-family:var(--font-display); font-size:22px; font-weight:600; margin:14px 0 2px; letter-spacing:-0.01em;}
  .screen-sub{font-size:13px; color:var(--ink-soft); margin:0; display:flex; align-items:center; gap:6px;}
  .back-btn{background:none; border:none; padding:6px 8px 6px 0; margin-left:-8px; color:var(--ink); font-size:14px; font-family:var(--font-body); font-weight:600; display:flex; align-items:center; gap:4px; cursor:pointer;}

  /* ---------- Content ---------- */
  .content{flex:1; padding:16px 20px 100px; overflow-y:auto;}

  /* ---------- KPI grid ---------- */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .kpi-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px 12px;}
  .kpi-value{font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1;}
  .kpi-label{font-size:11.5px; color:var(--ink-soft); margin-top:6px; letter-spacing:0.01em;}
  .kpi-card.accent{background:var(--ink); color:#fff;}
  .kpi-card.accent .kpi-label{color:#B9C0CC;}

  /* ---------- Section ---------- */
  .section{margin-bottom:24px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .section-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft);}

  /* ---------- Bar rows ---------- */
  .bar-row{margin-bottom:10px;}
  .bar-row-top{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px;}
  .bar-row-name{color:var(--ink); font-weight:600;}
  .bar-row-count{font-family:var(--font-display); color:var(--ink-soft);}
  .bar-track{height:8px; background:var(--border); border-radius:5px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:5px; transition:width 0.5s ease;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex; align-items:center; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:0.01em; white-space:nowrap;}
  .badge.ingresado{background:var(--c-ingresado-bg); color:var(--c-ingresado-ink);}
  .badge.encontrol{background:var(--c-encontrol-bg); color:var(--c-encontrol-ink);}
  .badge.observado{background:var(--c-observado-bg); color:var(--c-observado-ink);}
  .badge.controlado{background:var(--c-controlado-bg); color:var(--c-controlado-ink);}
  .badge.enviado{background:var(--c-enviado-bg); color:var(--c-enviado-ink);}
  .badge.pagado{background:var(--c-pagado-bg); color:var(--c-pagado-ink);}
  .badge.sin{background:var(--c-sin-bg); color:var(--c-sin-ink);}
  .badge.obra{background:#EAE7FB; color:#4A3B96;}

  /* ---------- Search / filters ---------- */
  .search-wrap{display:flex; gap:8px; margin-bottom:12px;}
  .search-input, .field-select{width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; font-family:var(--font-body); color:var(--ink);}
  .search-input:focus, .field-select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
  .filter-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin:12px 0 6px;}
  .chip-row{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex:none; padding:6px 12px; border-radius:999px; border:1px solid var(--border-strong); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}

  /* ---------- Certificate cards ---------- */
  .cert-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; cursor:pointer; display:flex; flex-direction:column; gap:8px;}
  .cert-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .cert-nro{font-family:var(--font-display); font-weight:600; font-size:14px;}
  .cert-meta{font-size:12.5px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:4px 10px;}
  .cert-meta span{white-space:nowrap;}
  .cert-obra{font-size:11.5px; font-weight:700; color:#4A3B96;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
  .empty-state-icon{font-size:32px; margin-bottom:10px;}
  .empty-state-title{font-weight:700; color:var(--ink); margin-bottom:4px; font-size:15px;}
  .empty-state-sub{font-size:13px; line-height:1.5;}

  /* ---------- Detail screen ---------- */
  .detail-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; margin-bottom:20px;}
  .detail-tarea{font-size:13.5px; color:var(--ink-soft);}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-top:14px;}
  .detail-field-label{font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-faint); margin-bottom:3px;}
  .detail-field-value{font-size:13.5px; font-weight:600;}
  .detail-field-value.pending{color:var(--ink-faint); font-weight:500; font-style:italic;}

  /* ---------- Timeline ---------- */
  .timeline{position:relative; padding-left:22px;}
  .timeline::before{content:''; position:absolute; left:6px; top:6px; bottom:6px; width:2px; background:repeating-linear-gradient(to bottom, var(--border-strong) 0 4px, transparent 4px 8px);}
  .tl-node{position:relative; padding-bottom:20px;}
  .tl-node:last-child{padding-bottom:0;}
  .tl-dot{position:absolute; left:-22px; top:2px; width:13px; height:13px; border-radius:50%; border:2.5px solid var(--surface); box-shadow:0 0 0 1.5px var(--border-strong);}
  .tl-node.latest .tl-dot{box-shadow:0 0 0 1.5px var(--accent);}
  .tl-node.latest .tl-dot::after{content:''; position:absolute; inset:-5px; border-radius:50%; border:1.5px solid var(--accent); animation:pulse 2s ease-out infinite;}
  @keyframes pulse{0%{opacity:0.9; transform:scale(0.7);} 100%{opacity:0; transform:scale(1.6);}}
  .tl-date{font-family:var(--font-display); font-size:11px; color:var(--ink-faint); margin-bottom:3px;}
  .tl-user{font-family:var(--font-display); font-size:10px; color:var(--ink-faint);}
  .tl-transition{font-size:13px; font-weight:600; margin:2px 0 3px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .tl-arrow{color:var(--ink-faint); font-weight:400;}
  .tl-obs{font-size:12.5px; color:var(--ink-soft); line-height:1.4;}

  /* ---------- Buttons ---------- */
  .btn{display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:13px 16px; border-radius:11px; border:none; font-family:var(--font-body); font-size:14.5px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-accent{background:var(--accent); color:#fff;}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--border-strong);}
  .btn[disabled]{opacity:0.55; pointer-events:none;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; background:var(--surface); border-top:1px solid var(--border); display:flex; z-index:30; padding-bottom:env(safe-area-inset-bottom, 0);}
  .nav-btn{flex:1; background:none; border:none; padding:10px 0 8px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint); font-family:var(--font-body); font-size:10.5px; font-weight:700; letter-spacing:0.02em;}
  .nav-btn.active{color:var(--ink);}
  .nav-btn svg{stroke:var(--ink-faint);}
  .nav-btn.active svg{stroke:var(--ink);}

  .fab{position:fixed; right:20px; bottom:76px; z-index:31; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff; border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px rgba(255,122,69,0.4); cursor:pointer;}
  @media (min-width:480px){ .fab{right:calc(50% - 220px);} }

  /* ---------- Modal / sheet ---------- */
  .overlay{position:fixed; inset:0; background:rgba(22,35,58,0.45); z-index:40; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s ease;}
  .overlay.open{opacity:1; pointer-events:auto;}
  .sheet{width:100%; max-width:480px; background:var(--bg); border-radius:20px 20px 0 0; padding:20px 20px 28px; max-height:88vh; overflow-y:auto; transform:translateY(16px); transition:transform 0.2s ease;}
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-title{font-family:var(--font-display); font-size:18px; font-weight:600; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field-label{font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; display:block;}
  .field-input, textarea.field-input{width:100%; background:var(--surface); border:1px solid var(--border-strong); border-radius:10px; padding:11px 12px; font-size:14.5px; font-family:var(--font-body); color:var(--ink);}
  textarea.field-input{resize:vertical; min-height:64px;}
  .field-input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
  .field-hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px;}
  .add-inline{display:flex; gap:8px; margin-top:8px;}
  .add-inline input{flex:1;}
  .add-inline button{flex:none; background:var(--surface); border:1px solid var(--border-strong); border-radius:10px; padding:0 14px; font-weight:700; font-size:13px; color:var(--ink); cursor:pointer;}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}

  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(10px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; font-weight:600; z-index:50; opacity:0; pointer-events:none; transition:opacity 0.2s ease, transform 0.2s ease; max-width:88%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--danger);}

  .session-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:18px;}
  .session-name{font-size:13px; font-weight:700;}
  .session-sub{font-size:11px; color:var(--ink-faint);}
  .logout-link{font-size:12px; font-weight:700; color:var(--ink-soft); background:none; border:none; cursor:pointer; text-decoration:underline;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  // ======================================================================
  // CONFIGURACION: pegá acá la URL de tu Web App de Google Apps Script
  // (ver la guía de instalación para saber cómo obtenerla).
  // ======================================================================
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzzLcCAMRXMGLgy5xkIuJ7ZgU6ADYQYthplfO23gAEzLGpDzifDcFJIC0FRgljFF3th/exec" ;

  var ESTADOS = ["Ingresado","En Control","Observado","Controlado OK","Enviado a Pago","Pagado"];
  var ESTADO_CLASS = {
    "Ingresado":"ingresado", "En Control":"encontrol", "Observado":"observado",
    "Controlado OK":"controlado", "Enviado a Pago":"enviado", "Pagado":"pagado",
    "Sin Ingresar":"sin"
  };
  var BAR_COLOR = {
    "Ingresado":"var(--c-ingresado-ink)", "En Control":"var(--c-encontrol-ink)",
    "Observado":"var(--c-observado-ink)", "Controlado OK":"var(--c-controlado-ink)",
    "Enviado a Pago":"var(--c-enviado-ink)", "Pagado":"var(--c-pagado-ink)"
  };

  var state = {
    session: null,            // { usuario, nombre }
    screen: "panel",
    loading: true,
    syncing: false,
    loginError: "",
    loggingIn: false,
    loginUsuario: "",
    certificados: [],
    movimientos: [],
    listas: { contratistas: [], obras: [], tareas: [] },
    filterEstado: "Todos",
    filterObra: "Todas",
    search: "",
    selectedNro: null,
    sheet: null
  };

  // ---------------- API (Google Sheets via Apps Script) ----------------
  function configured(){
    return APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf("http") === 0;
  }

  async function apiGetData(){
    var res = await fetch(APPS_SCRIPT_URL + "?action=data");
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function apiPost(action, payload){
    var body = Object.assign({ action: action }, payload || {});
    var res = await fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  async function refreshData(){
    state.syncing = true; render();
    try {
      var data = await apiGetData();
      state.certificados = data.certificados || [];
      state.movimientos = data.movimientos || [];
      state.listas = data.listas || { contratistas: [], obras: [], tareas: [] };
    } catch(e){
      showToast("No se pudo sincronizar con la planilla.", true);
    }
    state.syncing = false; render();
  }

  // ---------------- domain logic ----------------
  function movsDe(nro){
    return state.movimientos.filter(function(m){ return m.nro === nro; })
      .sort(function(a,b){ return a.fecha < b.fecha ? -1 : (a.fecha > b.fecha ? 1 : 0); });
  }
  function estadoActual(nro){
    var ms = movsDe(nro);
    return ms.length ? ms[ms.length-1].estadoNuevo : "Sin Ingresar";
  }
  function fechaControl(nro){
    var ms = movsDe(nro).filter(function(m){ return m.estadoNuevo === "Controlado OK" || m.estadoNuevo === "Observado"; });
    return ms.length ? ms[ms.length-1].fecha : null;
  }
  function fechaEnvio(nro){
    var ms = movsDe(nro).filter(function(m){ return m.estadoNuevo === "Enviado a Pago"; });
    return ms.length ? ms[ms.length-1].fecha : null;
  }
  function fmtFecha(iso){
    if(!iso) return null;
    var p = String(iso).slice(0,10).split("-");
    if(p.length!==3) return iso;
    return p[2]+"/"+p[1]+"/"+p[0];
  }
  function certConEstado(){
    return state.certificados.map(function(c){ return Object.assign({}, c, { estado: estadoActual(c.nro) }); });
  }
  function groupCount(list, key){
    var map = {};
    list.forEach(function(item){ var k = item[key] || "—"; map[k] = (map[k]||0) + 1; });
    return map;
  }

  // ---------------- toast ----------------
  var toastTimer = null;
  function showToast(msg, isError){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.className = "toast show" + (isError ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = "toast"; }, 2600);
  }

  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  // ---------------- icons ----------------
  function iconHome(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>'; }
  function iconList(){ return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>'; }
  function iconPlus(){ return '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'; }
  function iconMark(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/><circle cx="12" cy="12" r="1.4" fill="white" stroke="none"/></svg>'; }
  function iconMarkBig(){ return '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 12h10"/><circle cx="12" cy="12" r="1.4" fill="white" stroke="none"/></svg>'; }
  function iconRefresh(){ return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>'; }

  // ---------------- render ----------------
  function render(){
    var app = document.getElementById('app');
    if(!state.session){ app.innerHTML = renderLogin(); bindEvents(); return; }

    if(state.loading){
      app.innerHTML = '<div class="content" style="padding-top:80px;"><div class="empty-state"><div class="empty-state-icon">📡</div><div class="empty-state-title">Cargando datos de la planilla…</div></div></div>';
      return;
    }

    var html = "";
    if(state.screen === "panel") html = renderPanel();
    else if(state.screen === "lista") html = renderLista();
    else if(state.screen === "detalle") html = renderDetalle();

    html += renderBottomNav();
    if(state.screen !== "detalle") html += renderFab();
    html += renderSheet();

    app.innerHTML = html;
    bindEvents();
  }

  function renderLogin(){
    return '<div class="login-wrap">' +
      '<div class="login-mark">'+iconMarkBig()+'</div>' +
      '<div class="login-title">FTTH CONTROL</div>' +
      '<p class="login-sub">Control de certificados de obra. Ingresá con tu usuario para acceder a los datos compartidos.</p>' +
      '<div class="login-card">' +
        '<div class="field"><label class="field-label">Usuario</label><input class="field-input" id="fUsuario" type="text" autocomplete="username" placeholder="Ej: inspector1" value="'+esc(state.loginUsuario)+'"></div>' +
        '<div class="field" style="margin-bottom:6px;"><label class="field-label">PIN</label><input class="field-input" id="fPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••"></div>' +
        (state.loginError ? '<div class="login-error">'+esc(state.loginError)+'</div>' : '') +
        '<button class="btn btn-primary" style="margin-top:14px;" data-action="login" '+(state.loggingIn?'disabled':'')+'>'+(state.loggingIn?'Ingresando…':'Ingresar')+'</button>' +
      '</div>' +
      '<div class="login-footer">Los datos se guardan en la planilla de Google Sheets del equipo.'+(configured()?'':' <br><b>Falta configurar la URL de Apps Script en el archivo.</b>')+'</div>' +
    '</div>';
  }

  function topbarBrand(){
    return '<div class="topbar-row">' +
        '<div class="mark">'+iconMark()+'</div>' +
        '<div class="brand"><span class="brand-title">FTTH CONTROL</span><span class="brand-sub">'+esc(state.session.nombre)+'</span></div>' +
        '<div class="topbar-actions">' +
          '<button class="icon-btn'+(state.syncing?' spinning':'')+'" data-action="sync" title="Actualizar">'+iconRefresh()+'</button>' +
        '</div>' +
      '</div>';
  }

  function renderPanel(){
    var withEstado = certConEstado();
    var total = withEstado.length;
    var pendientes = withEstado.filter(function(c){ return c.estado==="Ingresado"||c.estado==="En Control"; }).length;
    var controlados = withEstado.filter(function(c){ return c.estado==="Controlado OK"||c.estado==="Observado"; }).length;
    var enviados = withEstado.filter(function(c){ return c.estado==="Enviado a Pago"||c.estado==="Pagado"; }).length;

    var porEstado = groupCount(withEstado, "estado");
    var porContratista = groupCount(withEstado, "contratista");
    var porObra = groupCount(withEstado, "obra");
    var porTarea = groupCount(withEstado, "tipoTarea");

    var html = '<div class="topbar">' + topbarBrand() +
      '<div class="screen-title">Panel de Control</div>' +
      '<p class="screen-sub">' + total + ' certificado' + (total===1?'':'s') + ' registrado' + (total===1?'':'s') + '</p>' +
    '</div>';

    html += '<div class="content">';
    if(!configured()){
      html += '<div class="empty-state"><div class="empty-state-icon">⚙️</div><div class="empty-state-title">Falta conectar la planilla</div><div class="empty-state-sub">Pegá la URL de tu Web App de Apps Script en la constante APPS_SCRIPT_URL, arriba del todo del archivo.</div></div></div>';
      return html;
    }
    if(total === 0){
      html += emptyState("📋","Todavía no hay certificados","Tocá el botón + para cargar el primero que te llegó por mail.");
      html += '</div>';
      return html;
    }

    html += '<div class="kpi-grid">' +
      kpiCard(total, "Total certificados", true) +
      kpiCard(pendientes, "Pendientes de control", false) +
      kpiCard(controlados, "Controlados", false) +
      kpiCard(enviados, "Enviados a pago / pagados", false) +
    '</div>';

    html += barSection("Por estado", ESTADOS, porEstado, total, function(k){ return BAR_COLOR[k]; });
    html += barSection("Por obra", Object.keys(porObra).sort(), porObra, total, function(){ return "#4A3B96"; });
    html += barSection("Por contratista", Object.keys(porContratista).sort(), porContratista, total, function(){ return "var(--accent-2)"; });
    html += barSection("Por tipo de tarea", Object.keys(porTarea).sort(), porTarea, total, function(){ return "var(--ink)"; });

    html += '</div>';
    return html;
  }

  function kpiCard(value, label, accent){
    return '<div class="kpi-card'+(accent?' accent':'')+'"><div class="kpi-value">'+value+'</div><div class="kpi-label">'+esc(label)+'</div></div>';
  }

  function barSection(title, keys, counts, total, colorFn){
    var rows = keys.filter(function(k){ return counts[k]; }).map(function(k){
      var n = counts[k] || 0;
      var pct = total ? Math.round((n/total)*100) : 0;
      return '<div class="bar-row">' +
        '<div class="bar-row-top"><span class="bar-row-name">'+esc(k)+'</span><span class="bar-row-count">'+n+'</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%; background:'+colorFn(k)+';"></div></div>' +
      '</div>';
    }).join("");
    if(!rows) return "";
    return '<div class="section"><div class="section-head"><span class="section-title">'+esc(title)+'</span></div>'+rows+'</div>';
  }

  function emptyState(icon, title, sub){
    return '<div class="empty-state"><div class="empty-state-icon">'+icon+'</div>' +
      '<div class="empty-state-title">'+esc(title)+'</div>' +
      '<div class="empty-state-sub">'+esc(sub)+'</div></div>';
  }

  function filteredCerts(){
    var withEstado = certConEstado();
    var q = state.search.trim().toLowerCase();
    return withEstado.filter(function(c){
      var matchesQ = !q || (c.nro.toLowerCase().indexOf(q)>-1 || c.contratista.toLowerCase().indexOf(q)>-1 || (c.obra||"").toLowerCase().indexOf(q)>-1);
      var matchesE = state.filterEstado === "Todos" || c.estado === state.filterEstado;
      var matchesO = state.filterObra === "Todas" || c.obra === state.filterObra;
      return matchesQ && matchesE && matchesO;
    }).sort(function(a,b){ return a.fechaRecepcion < b.fechaRecepcion ? 1 : -1; });
  }

  function renderLista(){
    var withEstado = certConEstado();
    var filtered = filteredCerts();
    var obras = state.listas.obras || [];

    var html = '<div class="topbar">' + topbarBrand() +
      '<div class="screen-title">Certificados</div>' +
      '<p class="screen-sub">'+withEstado.length+' en total</p>' +
    '</div>';

    html += '<div class="content">';
    html += '<div class="search-wrap"><input class="search-input" id="searchInput" type="text" placeholder="Buscar por N°, contratista u obra…" value="'+esc(state.search)+'"></div>';

    html += '<div class="filter-label">Estado</div>';
    var chips = ["Todos"].concat(ESTADOS);
    html += '<div class="chip-row">' + chips.map(function(e){
      return '<button class="chip'+(state.filterEstado===e?' active':'')+'" data-action="filtroEstado" data-estado="'+esc(e)+'">'+esc(e)+'</button>';
    }).join("") + '</div>';

    if(obras.length){
      html += '<div class="filter-label">Obra</div>';
      var chipsO = ["Todas"].concat(obras);
      html += '<div class="chip-row" id="chipRowObra">' + chipsO.map(function(o){
        return '<button class="chip'+(state.filterObra===o?' active':'')+'" data-action="filtroObra" data-obra="'+esc(o)+'">'+esc(o)+'</button>';
      }).join("") + '</div>';
    }

    html += '<div id="listaResultados">' + listaResultadosHtml(filtered) + '</div>';
    html += '</div>';
    return html;
  }

  function listaResultadosHtml(filtered){
    if(filtered.length === 0){
      return emptyState("🔍","Sin resultados","Probá otra búsqueda o cambiá los filtros.");
    }
    return filtered.map(function(c){
      return '<div class="cert-card" data-action="abrir" data-nro="'+esc(c.nro)+'">' +
        '<div class="cert-card-top"><span class="cert-nro">'+esc(c.nro)+'</span>' +
        '<span class="badge '+ESTADO_CLASS[c.estado]+'">'+esc(c.estado)+'</span></div>' +
        (c.obra ? '<div class="cert-obra">'+esc(c.obra)+'</div>' : '') +
        '<div class="cert-meta"><span>'+esc(c.contratista)+'</span><span>·</span><span>'+esc(c.tipoTarea)+'</span><span>·</span><span>'+esc(fmtFecha(c.fechaRecepcion))+'</span></div>' +
      '</div>';
    }).join("");
  }

  function renderDetalle(){
    var nro = state.selectedNro;
    var cert = state.certificados.find(function(c){ return c.nro===nro; });
    if(!cert){ state.screen = "lista"; return renderLista(); }
    var estado = estadoActual(nro);
    var fc = fechaControl(nro);
    var fe = fechaEnvio(nro);
    var ms = movsDe(nro).slice().reverse();

    var html = '<div class="topbar">' +
      '<button class="back-btn" data-action="volver">‹ Certificados</button>' +
      '<div class="screen-title">'+esc(nro)+'</div>' +
    '</div>';

    html += '<div class="content">';
    html += '<div class="detail-card">' +
      (cert.obra ? '<div class="badge obra" style="margin-bottom:8px;">'+esc(cert.obra)+'</div>' : '') +
      '<div class="cert-card-top" style="margin-bottom:2px;"><span class="detail-tarea">'+esc(cert.contratista)+' · '+esc(cert.tipoTarea)+'</span>' +
      '<span class="badge '+ESTADO_CLASS[estado]+'">'+esc(estado)+'</span></div>' +
      '<div class="detail-grid">' +
        detailField("Fecha de recepción", fmtFecha(cert.fechaRecepcion), false) +
        detailField("Fecha de control", fc?fmtFecha(fc):"Pendiente", !fc) +
        detailField("Fecha de envío a pago", fe?fmtFecha(fe):"Pendiente", !fe) +
      '</div>' +
    '</div>';

    html += '<button class="btn btn-accent" data-action="nuevoMov" style="margin-bottom:22px;">+ Registrar cambio de estado</button>';

    html += '<div class="section"><div class="section-head"><span class="section-title">Historial de movimientos</span></div>';
    if(ms.length===0){
      html += emptyState("🕓","Sin movimientos","Este certificado todavía no tiene historial.");
    } else {
      html += '<div class="timeline">' + ms.map(function(m, idx){
        return '<div class="tl-node'+(idx===0?' latest':'')+'">' +
          '<div class="tl-dot" style="background:'+(BAR_COLOR[m.estadoNuevo]||'var(--ink-faint)')+';"></div>' +
          '<div class="tl-date">'+esc(fmtFecha(m.fecha))+(m.registradoPor?'  ·  '+esc(m.registradoPor):'')+'</div>' +
          '<div class="tl-transition">' +
            (m.estadoAnterior ? '<span>'+esc(m.estadoAnterior)+'</span><span class="tl-arrow">→</span>' : '') +
            '<span class="badge '+ESTADO_CLASS[m.estadoNuevo]+'">'+esc(m.estadoNuevo)+'</span>' +
          '</div>' +
          (m.observacion ? '<div class="tl-obs">'+esc(m.observacion)+'</div>' : '') +
        '</div>';
      }).join("") + '</div>';
    }
    html += '</div></div>';
    return html;
  }

  function detailField(label, value, pending){
    return '<div><div class="detail-field-label">'+esc(label)+'</div><div class="detail-field-value'+(pending?' pending':'')+'">'+esc(value)+'</div></div>';
  }

  function renderBottomNav(){
    return '<div class="bottom-nav">' +
      '<button class="nav-btn'+(state.screen==="panel"?' active':'')+'" data-action="ir" data-screen="panel">'+iconHome()+'<span>PANEL</span></button>' +
      '<button class="nav-btn'+(state.screen==="lista"||state.screen==="detalle"?' active':'')+'" data-action="ir" data-screen="lista">'+iconList()+'<span>CERTIFICADOS</span></button>' +
      '<button class="nav-btn" data-action="logout"><span style="font-size:16px;">⎋</span><span>SALIR</span></button>' +
    '</div>';
  }

  function renderFab(){
    return '<button class="fab" data-action="nuevoCert" aria-label="Nuevo certificado">'+iconPlus()+'</button>';
  }

  function renderSheet(){
    if(!state.sheet) return '<div class="overlay" id="overlay"></div>';
    var inner = "";
    if(state.sheet === "nuevoCert") inner = sheetNuevoCert();
    else if(state.sheet === "nuevoMov") inner = sheetNuevoMov();
    return '<div class="overlay open" id="overlay" data-action="cerrarSheetBg"><div class="sheet" data-stop="1">'+inner+'</div></div>';
  }

  function sheetNuevoCert(){
    var contratistas = state.listas.contratistas;
    var obras = state.listas.obras;
    var tareas = state.listas.tareas;
    var today = new Date().toISOString().slice(0,10);
    return '<div class="sheet-title">Nuevo certificado</div>' +
      '<div class="field"><label class="field-label">N° de certificado</label>' +
        '<input class="field-input" id="fNro" type="text" placeholder="Ej: CERT-0003" autocomplete="off"></div>' +
      '<div class="field"><label class="field-label">Contratista</label>' +
        selectHtml('fContratista', contratistas) +
        '<div class="add-inline"><input class="field-input" id="fNuevaContratista" type="text" placeholder="Agregar contratista nueva"><button data-action="addContratista">Agregar</button></div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Obra</label>' +
        selectHtml('fObra', obras) +
        '<div class="add-inline"><input class="field-input" id="fNuevaObra" type="text" placeholder="Agregar obra nueva"><button data-action="addObra">Agregar</button></div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Tipo de tarea</label>' +
        selectHtml('fTarea', tareas) +
        '<div class="add-inline"><input class="field-input" id="fNuevaTarea" type="text" placeholder="Agregar tipo de tarea nuevo"><button data-action="addTarea">Agregar</button></div>' +
      '</div>' +
      '<div class="field"><label class="field-label">Fecha de recepción (mail)</label>' +
        '<input class="field-input" id="fFecha" type="date" value="'+today+'"></div>' +
      '<div class="field-hint" style="margin-bottom:14px;">Se registra una sola vez. Los cambios de estado se cargan después, desde el detalle del certificado.</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" data-action="cerrarSheet">Cancelar</button>' +
        '<button class="btn btn-primary" id="btnGuardarCert" data-action="guardarCert">Guardar certificado</button>' +
      '</div>';
  }

  function selectHtml(id, options){
    return '<select class="field-select" id="'+id+'"><option value="">Seleccionar…</option>' +
      options.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join("") +
    '</select>';
  }

  function sheetNuevoMov(){
    var nro = state.selectedNro;
    var estadoAnt = estadoActual(nro);
    var today = new Date().toISOString().slice(0,10);
    return '<div class="sheet-title">Nuevo movimiento — '+esc(nro)+'</div>' +
      '<div class="field"><label class="field-label">Estado anterior</label>' +
        '<div class="badge '+ESTADO_CLASS[estadoAnt]+'" style="font-size:13px; padding:7px 12px;">'+esc(estadoAnt)+'</div>' +
        '<div class="field-hint">Se toma solo, del último movimiento cargado.</div></div>' +
      '<div class="field"><label class="field-label">Estado nuevo</label>' +
        '<select class="field-select" id="fEstadoNuevo">' + ESTADOS.map(function(e){ return '<option value="'+esc(e)+'">'+esc(e)+'</option>'; }).join("") + '</select></div>' +
      '<div class="field"><label class="field-label">Fecha del cambio</label>' +
        '<input class="field-input" id="fFechaMov" type="date" value="'+today+'"></div>' +
      '<div class="field"><label class="field-label">Observación</label>' +
        '<textarea class="field-input" id="fObs" placeholder="Notas del control, N° de orden de pago, etc."></textarea></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" data-action="cerrarSheet">Cancelar</button>' +
        '<button class="btn btn-primary" id="btnGuardarMov" data-action="guardarMov">Guardar movimiento</button>' +
      '</div>';
  }

  // ---------------- events ----------------
  function bindEvents(){
    var app = document.getElementById('app');
    app.querySelectorAll('[data-action]').forEach(function(el){
      el.addEventListener('click', function(ev){
        var action = el.getAttribute('data-action');
        if(action === "cerrarSheetBg" && ev.target !== el) return;
        handleAction(action, el, ev);
      });
    });
    var search = document.getElementById('searchInput');
    if(search){
      search.addEventListener('input', function(){ state.search = search.value; refreshListaResultados(); });
    }
    var fPin = document.getElementById('fPin');
    if(fPin){ fPin.addEventListener('keydown', function(ev){ if(ev.key === "Enter") handleAction("login"); }); }
    var fUsuario = document.getElementById('fUsuario');
    if(fUsuario){
      fUsuario.addEventListener('input', function(){ state.loginUsuario = fUsuario.value; });
      fUsuario.addEventListener('keydown', function(ev){ if(ev.key === "Enter") handleAction("login"); });
    }
  }

  function refreshListaResultados(){
    var container = document.getElementById('listaResultados');
    if(!container) return;
    container.innerHTML = listaResultadosHtml(filteredCerts());
    var input = document.getElementById('searchInput');
    input.focus();
    var val = input.value;
    input.setSelectionRange(val.length, val.length);
  }

  async function handleAction(action, el, ev){
    if(action === "login"){ await doLogin(); }
    else if(action === "logout"){ state.session = null; state.screen = "panel"; render(); }
    else if(action === "sync"){ await refreshData(); }
    else if(action === "ir"){ state.screen = el.getAttribute('data-screen'); state.sheet = null; render(); }
    else if(action === "abrir"){ state.selectedNro = el.getAttribute('data-nro'); state.screen = "detalle"; render(); }
    else if(action === "volver"){ state.screen = "lista"; render(); }
    else if(action === "filtroEstado"){ state.filterEstado = el.getAttribute('data-estado'); render(); }
    else if(action === "filtroObra"){ state.filterObra = el.getAttribute('data-obra'); render(); }
    else if(action === "nuevoCert"){ state.sheet = "nuevoCert"; render(); }
    else if(action === "nuevoMov"){ state.sheet = "nuevoMov"; render(); }
    else if(action === "cerrarSheet" || action === "cerrarSheetBg"){ state.sheet = null; render(); }
    else if(action === "addContratista"){ await addListaInline('fNuevaContratista','fContratista','contratistas','addContratista'); }
    else if(action === "addObra"){ await addListaInline('fNuevaObra','fObra','obras','addObra'); }
    else if(action === "addTarea"){ await addListaInline('fNuevaTarea','fTarea','tareas','addTarea'); }
    else if(action === "guardarCert"){ await guardarCertificado(); }
    else if(action === "guardarMov"){ await guardarMovimiento(); }
  }

  async function doLogin(){
    var usuario = document.getElementById('fUsuario').value.trim();
    var pin = document.getElementById('fPin').value.trim();
    state.loginUsuario = usuario;
    state.loginError = "";
    if(!configured()){ state.loginError = "Falta configurar la URL de Apps Script en el archivo."; render(); return; }
    if(!usuario || !pin){ state.loginError = "Completá usuario y PIN."; render(); return; }
    state.loggingIn = true; render();
    try {
      var res = await apiPost('login', { usuario: usuario, pin: pin });
      if(res && res.ok){
        state.session = { usuario: usuario, nombre: res.nombre || usuario };
        state.loading = true; state.loggingIn = false; render();
        await refreshData();
        state.loading = false;
        state.screen = "panel";
        render();
      } else {
        state.loggingIn = false;
        state.loginError = "Usuario o PIN incorrecto.";
        render();
      }
    } catch(e){
      state.loggingIn = false;
      state.loginError = "No se pudo conectar con la planilla. Revisá tu conexión.";
      render();
    }
  }

  async function addListaInline(inputId, selectId, listaKey, apiAction){
    var input = document.getElementById(inputId);
    var val = input.value.trim();
    if(!val) return;
    if(state.listas[listaKey].indexOf(val) === -1){
      state.listas[listaKey].push(val);
    }
    input.value = "";
    var sel = document.getElementById(selectId);
    if(sel){
      var exists = Array.prototype.some.call(sel.options, function(o){ return o.value === val; });
      if(!exists){
        var opt = document.createElement('option');
        opt.value = val; opt.textContent = val;
        sel.appendChild(opt);
      }
      sel.value = val;
    }
    try { await apiPost(apiAction, { valor: val }); }
    catch(e){ showToast("No se pudo guardar en la planilla, pero podés seguir usando este valor ahora.", true); }
  }

  async function guardarCertificado(){
    var nro = document.getElementById('fNro').value.trim();
    var contratista = document.getElementById('fContratista').value;
    var obra = document.getElementById('fObra').value;
    var tarea = document.getElementById('fTarea').value;
    var fecha = document.getElementById('fFecha').value;

    if(!nro || !contratista || !obra || !tarea || !fecha){
      showToast("Completá todos los campos.", true);
      return;
    }
    if(state.certificados.some(function(c){ return c.nro.toLowerCase() === nro.toLowerCase(); })){
      showToast("Ya existe un certificado con ese número.", true);
      return;
    }

    var btn = document.getElementById('btnGuardarCert');
    btn.setAttribute('disabled','disabled'); btn.textContent = "Guardando…";
    try {
      var res = await apiPost('addCertificado', { nro: nro, contratista: contratista, obra: obra, tipoTarea: tarea, fechaRecepcion: fecha, usuario: state.session.usuario });
      if(res && res.ok === false){
        showToast(res.error || "No se pudo guardar.", true);
        btn.removeAttribute('disabled'); btn.textContent = "Guardar certificado";
        return;
      }
      await apiPost('addMovimiento', { nro: nro, fecha: fecha, estadoAnterior: "", estadoNuevo: "Ingresado", observacion: "Certificado recibido.", usuario: state.session.usuario });
    } catch(e){
      showToast("No se pudo guardar en la planilla. Verificá tu conexión.", true);
      btn.removeAttribute('disabled'); btn.textContent = "Guardar certificado";
      return;
    }

    state.sheet = null;
    state.screen = "lista";
    showToast("Certificado "+nro+" cargado.");
    render();
    await refreshData();
  }

  async function guardarMovimiento(){
    var nro = state.selectedNro;
    var estadoNuevo = document.getElementById('fEstadoNuevo').value;
    var fecha = document.getElementById('fFechaMov').value;
    var obs = document.getElementById('fObs').value.trim();
    if(!fecha){ showToast("Elegí una fecha.", true); return; }
    var estadoAnt = estadoActual(nro);

    var btn = document.getElementById('btnGuardarMov');
    btn.setAttribute('disabled','disabled'); btn.textContent = "Guardando…";
    try {
      await apiPost('addMovimiento', { nro: nro, fecha: fecha, estadoAnterior: estadoAnt, estadoNuevo: estadoNuevo, observacion: obs, usuario: state.session.usuario });
    } catch(e){
      showToast("No se pudo guardar en la planilla. Verificá tu conexión.", true);
      btn.removeAttribute('disabled'); btn.textContent = "Guardar movimiento";
      return;
    }

    state.sheet = null;
    showToast("Movimiento registrado.");
    render();
    await refreshData();
  }

  // ---------------- init ----------------
  state.loading = false;
  render();
})();
</script>
</body>
</html>
